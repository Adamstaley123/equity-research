# Payments sector — company universe for the valuation dashboard.
#
# To run this sector:        python pipeline/run.py --sector payments
# To run a subset:           python pipeline/run.py --sector payments --tickers FOUR --tickers TOST
#
# Don't even need a file: `python pipeline/run.py --tickers TOST,FI,FOUR --name Payments`
# runs an ad-hoc sector and auto-fills metadata from Yahoo. A curated YAML like
# this just makes the output polished and repeatable.
#
# To add your OWN sector, copy this file to sectors/<name>.yaml and edit the
# companies map. EVERY per-company field except the ticker key is OPTIONAL —
# anything you omit is auto-filled from Yahoo Finance. A bare `TICKER:` works.
#
# Per-company fields (all optional):
#   name            Display name                 (default: Yahoo longName)
#   focus           One-line business description (default: Yahoo industry)
#   exchange        NYSE | NASDAQ | AMS | ...     (default: from Yahoo)
#   currency        Reporting currency            (default: from Yahoo; non-USD is FX-converted)
#   cik             SEC CIK override, zero-padded, quoted — only if auto-lookup is wrong
#   yfinance_ticker Yahoo symbol when it differs from `ticker`
#   flags           tags: net_revenue | gross_revenue | european

name: Payments
description: US & European payments, fintech infrastructure, and money-movement platforms.

companies:
  TOST:
    name: Toast, Inc.
    focus: Restaurant payments OS
    exchange: NYSE
    currency: USD
  FI:
    name: Fiserv, Inc.
    focus: Payments + banking tech
    exchange: NYSE
    currency: USD
    cik: "0000798354"          # short ticker "FI" fools CIK auto-lookup
    yfinance_ticker: FISV      # Yahoo still lists Fiserv under FISV
  FOUR:
    name: Shift4 Payments
    focus: Integrated payments (hospitality)
    exchange: NYSE
    currency: USD
    flags: [gross_revenue]
  JKHY:
    name: Jack Henry & Associates
    focus: Banking / community FI payments
    exchange: NASDAQ
    currency: USD
  MQ:
    name: Marqeta, Inc.
    focus: Card issuing-as-a-service
    exchange: NASDAQ
    currency: USD
    flags: [net_revenue]
  WEX:
    name: WEX Inc.
    focus: Fleet & B2B payments
    exchange: NYSE
    currency: USD
  FLYW:
    name: Flywire Corporation
    focus: Global payments (edu, healthcare)
    exchange: NASDAQ
    currency: USD
  PAYO:
    name: Payoneer Global Inc.
    focus: Cross-border & SMB payments
    exchange: NASDAQ
    currency: USD
    flags: [net_revenue]
  PAY:
    name: Paymentus Holdings
    focus: Bill payment platform (utilities, govt)
    exchange: NYSE
    currency: USD
    flags: [gross_revenue]
  RPAY:
    name: Repay Holdings Corp.
    focus: Integrated payments (vertical markets)
    exchange: NASDAQ
    currency: USD
  GDOT:
    name: Green Dot Corporation
    focus: Prepaid debit / Banking-as-a-Service
    exchange: NYSE
    currency: USD
  PRTH:
    name: Priority Technology Holdings
    focus: SMB payments & banking solutions
    exchange: NASDAQ
    currency: USD
  # ── Foreign issuer — disabled by default ──────────────────────────────────
  # Adyen files in the Netherlands, not with the SEC, so it has no EDGAR XBRL.
  # Its financials are only available via the opt-in StockAnalysis scrape, so it
  # is commented out of the default (keyless) run. To include it, uncomment and
  # run with `--use-scrape` (subject to StockAnalysis's ToS — see DATA_SOURCES.md).
