# Semiconductors sector — company universe for the valuation dashboard.
#
# To run this sector:   python pipeline/run.py --sector semiconductors
# To run a subset:      python pipeline/run.py --sector semiconductors --tickers NVDA --tickers AMD
#
# This file is also the "second sector" reference: it deliberately uses NO `cik`
# overrides, relying on SEC EDGAR auto-lookup, to mirror exactly what happens
# when someone clones the repo and runs it on their own (unambiguous) tickers.
#
# Per-company fields (see sectors/payments.yaml for the full list):
#   name / focus / exchange / currency, plus optional cik / yfinance_ticker / flags / foreign.

